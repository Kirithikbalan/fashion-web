<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

    <div class="container text-center mt-4">
        <h1 class="bg-primary text-info p-3 rounded">Fashion Store</h1>

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvkEDZ1tqFLIAyXPIm99eYARD14iAyvyWFpQ&s" 
             class="img-fluid rounded mt-3" style="max-width:300px;">

        <p class="fw-bold text-info mt-3">
            You can find many dresses for men, women and children, and many other products.
        </p>
    </div>

    <div class="container mt-5">
        <div class="row text-center">

            <div class="col-md-6 mb-4">
                <h2 class="text-info">Men's Wear</h2>
                <img src="https://img.freepik.com/free-photo/young-man-model-posing-street_1303-14448.jpg?semt=ais_hybrid&w=740&q=80" 
                     class="img-fluid rounded" style="max-height:300px;">
            </div>

            <div class="col-md-6 mb-4">
                <h2 class="text-info">Women's Wear</h2>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQPWVgNGVooW3aCYAOtHquNfMenKLKNSsFS5A&s" 
                     class="img-fluid rounded" style="max-height:300px;">
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-primary text-center text-light py-3 mt-5">
        &copy; No copyrights
    </footer>

</body>
</html>
